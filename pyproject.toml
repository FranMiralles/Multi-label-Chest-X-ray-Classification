[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "chestmnist"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "medmnist>=3.0",
    "monai>=1.3",
    "optuna>=4.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "tqdm>=4.65",
    "grad-cam>=1.5",
    "pillow>=10.0",
    "ipykernel>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
